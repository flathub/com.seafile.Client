app-id: com.seafile.Client
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
base: io.qt.qtwebengine.BaseApp
base-version: '6.10'
command: seafile-applet
rename-desktop-file: com.seafile.seafile-applet.desktop
rename-icon: seafile
sdk-extensions:
  - org.freedesktop.Sdk.Extension.vala
build-options:
  prepend-path: /usr/lib/sdk/vala/bin/
  prepend-ld-library-path: /usr/lib/sdk/vala/lib
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --share=network
  - --device=dri
  - --env=QTWEBENGINEPROCESS_PATH=/app/bin/QtWebEngineProcess
  - --persist=.ccnet
  - --filesystem=home/Seafile:create # Where user libraries are stored by default
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=com.canonical.indicator.application
cleanup:
  - /share/man
  - '*.la'
  - '*.a'
cleanup-commands:
  - /app/cleanup-BaseApp.sh
modules:
  - name: libevent
    sources:
      - type: archive
        url: https://github.com/libevent/libevent/releases/download/release-2.1.12-stable/libevent-2.1.12-stable.tar.gz
        sha256: 92e6de1be9ec176428fd2367677e61ceffc2ee1cb119035037a27d346b0403bb

  - name: jansson
    sources:
      - type: archive
        url: https://digip.org/jansson/releases/jansson-2.13.1.tar.bz2
        sha256: ee90a0f879d2b7b7159124ff22b937a2a9a8c36d3bb65d1da7dd3f04370a10bd

  - name: libsearpc
    config-opts:
      - --with-python_prefix=/app
    sources:
      - type: archive
        url: https://github.com/haiwen/libsearpc/archive/refs/tags/v3.3-latest.tar.gz
        sha256: 07037abb4bfe2d4c05924ff680178e480ad943f641c98125f74ff162ab2d7fb1

  - name: libwebsockets
    buildsystem: cmake-ninja
    config-opts:
      - -D LWS_WITHOUT_TESTAPPS=ON
    sources:
      - type: git
        url: https://libwebsockets.org/repo/libwebsockets
        tag: v4.5.2
        commit: 85c6f7959fd40d8aaf7a50be3c9b75f08389a01c

  - name: libargon2
    buildsystem: simple
    build-commands:
      - make -j$FLATPAK_BUILDER_N_JOBS PREFIX=/app LIBRARY_REL=lib install
    sources:
      - type: archive
        url: https://github.com/P-H-C/phc-winner-argon2/archive/refs/tags/20190702.tar.gz
        sha256: daf972a89577f8772602bf2eb38b6a3dd3d922bf5724d45e7f9589b5e830442c

  - name: seafile
    config-opts:
      - --with-python_prefix=/app
    sources:
      - type: git
        url: https://github.com/haiwen/seafile.git
        tag: v9.0.21
        commit: 2ebf6ac8b0755c9a88d5ed9295f50e7c6c9a3255
        x-checker-data:
          type: git
          version-scheme: semantic
          tag-pattern: ^v([\d.]+)$

  - name: seafile-client
    buildsystem: cmake-ninja
    config-opts:
      - -D CMAKE_POLICY_VERSION_MINIMUM=3.5
    post-install:
      - install -Dm644 com.seafile.Client.metainfo.xml -t $FLATPAK_DEST/share/metainfo/
    sources:
      - type: git
        url: https://github.com/haiwen/seafile-client.git
        tag: v9.0.21
        commit: d6547e7d7bc14db6644da6e77228814a337db9ef
        x-checker-data:
          type: git
          version-scheme: semantic
          tag-pattern: ^v([\d.]+)$
      # TODO remove once merged upstream: https://github.com/haiwen/seafile-client/pull/1670
      - type: patch
        path: fix-qt-6.9.diff
      - type: file
        path: com.seafile.Client.metainfo.xml
